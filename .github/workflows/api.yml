name: Build & Push API

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Rust API
        run: |
          cargo fmt --manifest-path api/Cargo.toml --check
          cargo test --manifest-path api/Cargo.toml --locked
          cargo clippy --manifest-path api/Cargo.toml --locked --all-targets -- -D warnings
          cargo fmt --manifest-path api/client/Cargo.toml --check
          cargo clippy --manifest-path api/client/Cargo.toml --locked --all-targets -- -D warnings

  publish-api:
    needs: api-checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/upayanmazumder/upayan.dev/api:latest
            ghcr.io/upayanmazumder/upayan.dev/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
