[package]
name = "upayan-stats-api"
version = "5.0.0"
edition = "2024"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
hmac = "0.12"
hex = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
