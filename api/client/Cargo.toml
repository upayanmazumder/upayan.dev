[package]
name = "pc-report-client"
version = "5.0.0"
edition = "2024"

[dependencies]
hmac = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
